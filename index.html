<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Personal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{max-width:760px;margin:auto;padding:0 12px 88px}.hero{margin:0 -12px 14px;padding:18px 16px 16px;background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#3b82f6);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(37,99,235,.18)}.heroTop{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{margin:0;font-size:24px}.hero .muted{color:#dbeafe;font-size:12px;margin-top:4px}.heroIcon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.24)}.toolbar,.datebar{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:10px;margin-top:10px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.toolbar strong{color:#344054}.toolbar button,.datebar button,.addbtn{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:#eef2ff;color:#245eea}.datebar{display:flex;gap:8px;align-items:center}.datebar input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:9px;font:inherit}.actions{display:flex;gap:7px;margin:10px 0}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd!important}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.person{position:relative;background:#fff;border:1px solid #e4e7ec;border-radius:14px;min-height:122px;padding:11px 9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;transition:.15s}.name{font-size:13px;font-weight:750;line-height:1.2;min-height:31px;display:flex;align-items:center;justify-content:center;width:100%;overflow-wrap:anywhere}.temp{font-size:9px;color:#b54708;margin-top:2px}.statuswrap{position:relative;width:54px}.statusbtn{width:54px;height:42px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-weight:900;font-size:18px;color:#172033}.statusbtn.st-trabajo{color:#067647;background:#ecfdf3;border-color:#abefc6}.statusbtn.st-libre{color:#175cd3;background:#eff8ff;border-color:#b2ddff}.statusbtn.st-falta{color:#b42318;background:#fef3f2;border-color:#fecdca}.statusbtn.st-permiso{color:#b54708;background:#fffaeb;border-color:#fedf89}.statusbtn.st-vacaciones{color:#6941c6;background:#f4f3ff;border-color:#d9d6fe}.statusbtn.st-enfermedad{color:#0e7490;background:#ecfeff;border-color:#a5f3fc}.person.st-trabajo{border-top:4px solid #12b76a}.person.st-libre{border-top:4px solid #2e90fa}.person.st-falta{border-top:4px solid #f04438}.person.st-permiso{border-top:4px solid #f79009}.person.st-vacaciones{border-top:4px solid #7f56d9}.person.st-enfermedad{border-top:4px solid #06b6d4}.statusmenu{display:none;position:absolute;left:50%;transform:translateX(-50%);top:47px;z-index:30;width:150px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.18);padding:5px;text-align:left}.statusmenu.open{display:block}.statusmenu button{width:100%;border:0;background:#fff;text-align:left;padding:9px 10px;border-radius:7px;font-size:13px;font-weight:650}.statusmenu button:active{background:#eef2ff}.statusmenu .opt-trabajo{color:#067647}.statusmenu .opt-libre{color:#175cd3}.statusmenu .opt-falta{color:#b42318}.statusmenu .opt-permiso{color:#b54708}.statusmenu .opt-vacaciones{color:#6941c6}.statusmenu .opt-enfermedad{color:#0e7490}.remove{position:absolute;right:4px;top:2px;border:0;background:transparent;color:#98a2b3;font-size:18px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11px}.legend span{border-radius:999px;padding:5px 7px;font-weight:700}.lg-t{color:#067647;background:#ecfdf3}.lg-l{color:#175cd3;background:#eff8ff}.lg-f{color:#b42318;background:#fef3f2}.lg-p{color:#b54708;background:#fffaeb}.lg-v{color:#6941c6;background:#f4f3ff}.lg-e{color:#0e7490;background:#ecfeff}.panel{display:none}.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}.panelTitle h2{margin:0}.sum{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:10px;margin:8px 0}.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.personRow{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:11px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.personRowName{font-weight:750;font-size:14px}.deleteBtn{border:1px solid #fecdca;background:#fef3f2;color:#b42318;border-radius:9px;padding:8px 10px;font-weight:800;font-size:12px}.deleteBtn:active{background:#fee4e2}nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:#fff;padding:14px 4px;font-weight:700;color:#667085}nav button.active{color:#2563eb}.modal{position:fixed;inset:0;background:rgba(16,24,40,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:100%;max-width:760px;background:#fff;border-radius:18px 18px 0 0;padding:18px}.sheet h3{margin:0 0 12px}.sheet input,.sheet select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 10px;font:inherit}.sheetactions{display:flex;gap:8px}.sheetactions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800}.danger{color:#d92d20}
@media(max-width:390px){.cards{gap:7px}.person{padding:9px 6px;min-height:116px}.name{font-size:12px}.statusmenu{width:142px}.deleteBtn{padding:8px 9px}}
</style></head>
<body><div class="app">
<div class="hero"><div class="heroTop"><div><h1>Control de Personal</h1><div class="muted">Registro diario de asistencia</div></div><div class="heroIcon">✓</div></div></div>
<section id="today">
<div class="toolbar"><button onclick="moveDay(-1)">‹</button><strong id="dayTitle"></strong><button onclick="moveDay(1)">›</button></div>
<div class="datebar"><input id="datePicker" type="date" onchange="pickDate(this.value)"><button onclick="openAdd()">+ Personal</button></div>
<div class="actions"><button class="primary" onclick="allWork()">Todos T</button><button class="secondary" onclick="clearDay()">Limpiar día</button></div>
<div id="list" class="cards"></div>
<div class="legend"><span class="lg-t">T Trabajo</span><span class="lg-l">L Libre</span><span class="lg-f">F Falta</span><span class="lg-p">P Permiso</span><span class="lg-v">V Vacaciones</span><span class="lg-e">E Enfermedad</span></div>
</section>
<section id="people" class="panel"><div class="panelTitle"><h2>Personal fijo</h2><button class="addbtn" onclick="openAdd('fixed')">+ Agregar</button></div><div class="muted">Desde aquí puedes eliminar definitivamente a alguien que ya no trabaja.</div><div id="peopleList"></div></section>
<section id="summary" class="panel"><h2>Resumen mensual</h2><div id="summaryList"></div></section>
</div>
<nav><button id="nToday" class="active" onclick="tab('today')">Hoy</button><button id="nPeople" onclick="tab('people')">Personal</button><button id="nSummary" onclick="tab('summary')">Resumen</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeAdd()"><div class="sheet"><h3>Agregar personal</h3><input id="newName" placeholder="Nombre y apellido"><select id="newType"><option value="temp">Solo este día</option><option value="fixed">Personal fijo</option></select><div class="sheetactions"><button class="secondary" onclick="closeAdd()">Cancelar</button><button class="primary" onclick="addPerson()">Agregar</button></div></div></div>
<script>
const defaultStaff=['Ana Torres','Carlos Mendoza','María López','José Ramírez','Paola Vera','Luis Cedeño','Daniela Ruiz','Miguel Zambrano'];
const codes={'':'—','Trabajó':'T','Libre':'L','Falta':'F','Permiso':'P','Vacaciones':'V','Enfermedad':'E'};
const states=['Trabajó','Libre','Falta','Permiso','Vacaciones','Enfermedad'];
const classes={'':'','Trabajó':'st-trabajo','Libre':'st-libre','Falta':'st-falta','Permiso':'st-permiso','Vacaciones':'st-vacaciones','Enfermedad':'st-enfermedad'};
const optClasses={'Trabajó':'opt-trabajo','Libre':'opt-libre','Falta':'opt-falta','Permiso':'opt-permiso','Vacaciones':'opt-vacaciones','Enfermedad':'opt-enfermedad'};
let staff=JSON.parse(localStorage.getItem('cp-staff')||'null')||defaultStaff;
let temps=JSON.parse(localStorage.getItem('cp-temps')||'{}');
let data=JSON.parse(localStorage.getItem('cp-data')||'{}');let selected=new Date();let currentPeople=[];
function iso(d=selected){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function save(){localStorage.setItem('cp-data',JSON.stringify(data));localStorage.setItem('cp-staff',JSON.stringify(staff));localStorage.setItem('cp-temps',JSON.stringify(temps))}
function peopleToday(){return [...staff,...(temps[iso()]||[])]}
function mark(n,s){data[iso()]??={};if(s)data[iso()][n]=s;else delete data[iso()][n];save();render()}
function chooseStatus(i,s,e){if(e)e.stopPropagation();let n=currentPeople[i];if(n!==undefined)mark(n,s)}
function allWork(){data[iso()]??={};peopleToday().forEach(n=>data[iso()][n]='Trabajó');save();render()}
function clearDay(){delete data[iso()];save();render()}
function moveDay(d){selected.setDate(selected.getDate()+d);render()}
function pickDate(v){if(v)selected=new Date(v+'T12:00:00');render()}
function openAdd(type){document.getElementById('modal').style.display='flex';document.getElementById('newName').value='';document.getElementById('newType').value=type||'temp';setTimeout(()=>document.getElementById('newName').focus(),50)}
function closeAdd(){document.getElementById('modal').style.display='none'}
function addPerson(){let n=document.getElementById('newName').value.trim();let t=document.getElementById('newType').value;if(!n)return;if(t==='fixed'){if(!staff.includes(n))staff.push(n)}else{temps[iso()]??=[];if(!temps[iso()].includes(n))temps[iso()].push(n)}save();closeAdd();render()}
function removeTemp(n){temps[iso()]=(temps[iso()]||[]).filter(x=>x!==n);if(data[iso()])delete data[iso()][n];save();render()}
function removeFixed(n){if(!confirm('¿Eliminar a '+n+' del personal activo?\n\nSu historial anterior se conservará.'))return;staff=staff.filter(x=>x!==n);save();render()}
function toggleMenu(id,e){e.stopPropagation();document.querySelectorAll('.statusmenu.open').forEach(x=>{if(x.id!==id)x.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
function selector(current,i){let id='sm'+i,cl=classes[current]||'';return `<div class="statuswrap"><button type="button" class="statusbtn ${cl}" onclick="toggleMenu('${id}',event)">${codes[current]||'—'}</button><div class="statusmenu" id="${id}" onclick="event.stopPropagation()"><button type="button" onclick="chooseStatus(${i},'',event)">Sin marcar</button>${states.map(s=>`<button type="button" class="${optClasses[s]}" onclick="chooseStatus(${i},'${s}',event)">${s}</button>`).join('')}</div></div>`}
document.addEventListener('click',()=>document.querySelectorAll('.statusmenu.open').forEach(x=>x.classList.remove('open')));
function render(){let k=iso(),rec=data[k]||{},tmp=temps[k]||[];currentPeople=peopleToday();document.getElementById('dayTitle').textContent=selected.toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'}).replace(/^./,c=>c.toUpperCase());document.getElementById('datePicker').value=k;document.getElementById('list').innerHTML=currentPeople.map((n,i)=>{let st=rec[n]||'',cl=classes[st]||'';return `<div class="person ${cl}"><div><div class="name">${n}</div>${tmp.includes(n)?'<div class="temp">Temporal · solo hoy</div>':''}</div>${selector(st,i)}${tmp.includes(n)?`<button class="remove" onclick="removeTemp(currentPeople[${i}])">×</button>`:''}</div>`}).join('');document.getElementById('peopleList').innerHTML=staff.map(n=>`<div class="personRow"><div><div class="personRowName">${n}</div><div class="muted">Personal activo</div></div><button class="deleteBtn" onclick="removeFixed(${JSON.stringify(n)})">Eliminar</button></div>`).join('');renderSummary()}
function renderSummary(){let m=selected.getMonth(),y=selected.getFullYear();document.getElementById('summaryList').innerHTML=staff.map(n=>{let c={};Object.entries(data).forEach(([k,v])=>{let d=new Date(k+'T12:00:00');if(d.getMonth()===m&&d.getFullYear()===y&&v[n])c[v[n]]=(c[v[n]]||0)+1});return `<div class="sum"><b>${n}</b>${states.map(s=>`<div class="sumrow"><span class="${optClasses[s]}">${codes[s]} · ${s}</span><b>${c[s]||0}</b></div>`).join('')}</div>`}).join('')}
function tab(t){['today','people','summary'].forEach(x=>document.getElementById(x).style.display=x===t?'block':'none');['Today','People','Summary'].forEach(x=>document.getElementById('n'+x).classList.remove('active'));document.getElementById('n'+t[0].toUpperCase()+t.slice(1)).classList.add('active');if(t==='summary')renderSummary()}
render();
</script></body></html>
