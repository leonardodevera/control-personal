<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Control de Personal</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{max-width:760px;margin:auto;padding:0 12px 88px}.hero{margin:0 -12px 14px;padding:18px 16px;background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#3b82f6);color:#fff;border-radius:0 0 22px 22px}.heroTop,.toolbar,.datebar,.panelTitle,.personRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.hero h1{margin:0;font-size:24px}.muted{color:#667085;font-size:12px}.hero .muted{color:#dbeafe}.heroIcon{width:44px;height:44px;border-radius:14px;background:#ffffff2e;display:flex;align-items:center;justify-content:center;font-size:22px}.toolbar,.datebar{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:10px;margin-top:10px}.toolbar button,.datebar button,.addbtn{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:#eef2ff;color:#245eea}.datebar input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:9px}.actions{display:flex;gap:7px;margin:10px 0}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd!important}.demoBtn{background:#f4f3ff!important;color:#6941c6!important}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.person{position:relative;background:#fff;border:1px solid #e4e7ec;border-radius:14px;min-height:122px;padding:11px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.name{font-size:13px;font-weight:750;line-height:1.2;min-height:31px;display:flex;align-items:center}.temp{font-size:9px;color:#b54708}.statuswrap{position:relative;width:54px}.statusbtn{width:54px;height:42px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-weight:900;font-size:18px}.st-trabajo{color:#067647!important}.statusbtn.st-trabajo{background:#ecfdf3;border-color:#abefc6}.person.st-trabajo{border-top:4px solid #12b76a}.st-libre{color:#175cd3!important}.statusbtn.st-libre{background:#eff8ff;border-color:#b2ddff}.person.st-libre{border-top:4px solid #2e90fa}.st-falta{color:#b42318!important}.statusbtn.st-falta{background:#fef3f2;border-color:#fecdca}.person.st-falta{border-top:4px solid #f04438}.st-permiso{color:#b54708!important}.statusbtn.st-permiso{background:#fffaeb;border-color:#fedf89}.person.st-permiso{border-top:4px solid #f79009}.st-vacaciones{color:#6941c6!important}.statusbtn.st-vacaciones{background:#f4f3ff;border-color:#d9d6fe}.person.st-vacaciones{border-top:4px solid #7f56d9}.st-enfermedad{color:#0e7490!important}.statusbtn.st-enfermedad{background:#ecfeff;border-color:#a5f3fc}.person.st-enfermedad{border-top:4px solid #06b6d4}.statusmenu{display:none;position:absolute;left:50%;transform:translateX(-50%);top:47px;z-index:30;width:150px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 8px 24px #1018282e;padding:5px;text-align:left}.statusmenu.open{display:block}.statusmenu button{width:100%;border:0;background:#fff;text-align:left;padding:9px;border-radius:7px}.remove{position:absolute;right:4px;top:2px;border:0;background:transparent;color:#98a2b3;font-size:18px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11px}.legend span{border-radius:999px;padding:5px 7px;font-weight:700}.lg-t{color:#067647;background:#ecfdf3}.lg-l{color:#175cd3;background:#eff8ff}.lg-f{color:#b42318;background:#fef3f2}.lg-p{color:#b54708;background:#fffaeb}.lg-v{color:#6941c6;background:#f4f3ff}.lg-e{color:#0e7490;background:#ecfeff}.panel{display:none}.panelTitle h2{margin:4px 0 10px}.personRow,.sum{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:11px 12px;margin:8px 0}.personRowName{font-weight:750}.offBtn,.reactivateBtn{border-radius:9px;padding:8px 10px;font-weight:800;font-size:12px}.offBtn{border:1px solid #fedf89;background:#fffaeb;color:#b54708}.reactivateBtn{border:1px solid #abefc6;background:#ecfdf3;color:#067647}.inactive{opacity:.76}.badgeOff{display:inline-block;margin-top:3px;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#667085;font-size:10px}.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr)}nav button{border:0;background:#fff;padding:14px 4px;font-weight:700;color:#667085}nav button.active{color:#2563eb}.modal{position:fixed;inset:0;background:#10182861;display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:100%;max-width:760px;background:#fff;border-radius:18px 18px 0 0;padding:18px}.sheet input,.sheet select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 10px}.sheetactions{display:flex;gap:8px}.sheetactions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800}@media(max-width:390px){.cards{gap:7px}.person{min-height:116px}.name{font-size:12px}}</style></head><body><div class="app"><div class="hero"><div class="heroTop"><div><h1>Control de Personal</h1><div class="muted">Registro diario de asistencia</div></div><div class="heroIcon">✓</div></div></div><section id="today"><div class="toolbar"><button onclick="moveDay(-1)">‹</button><strong id="dayTitle"></strong><button onclick="moveDay(1)">›</button></div><div class="datebar"><input id="datePicker" type="date" onchange="pickDate(this.value)"><button onclick="openAdd()">+ Personal</button></div><div class="actions"><button class="primary" onclick="allWork()">Todos T</button><button class="secondary" onclick="clearDay()">Limpiar día</button></div><div id="list" class="cards"></div><div class="legend"><span class="lg-t">T Trabajo</span><span class="lg-l">L Libre</span><span class="lg-f">F Falta</span><span class="lg-p">P Permiso</span><span class="lg-v">V Vacaciones</span><span class="lg-e">E Enfermedad</span></div></section><section id="people" class="panel"><div class="panelTitle"><h2>Personal</h2><button class="addbtn" onclick="openAdd('fixed')">+ Agregar</button></div><div class="muted">Puedes dar de baja sin perder el historial y reactivar si fue un error.</div><div id="peopleList"></div></section><section id="summary" class="panel"><div class="panelTitle"><h2>Resumen mensual</h2><button class="addbtn demoBtn" onclick="loadAugustDemo(true)">Demo agosto</button></div><div id="summaryList"></div></section></div><nav><button id="nToday" class="active" onclick="tab('today')">Hoy</button><button id="nPeople" onclick="tab('people')">Personal</button><button id="nSummary" onclick="tab('summary')">Resumen</button></nav><div id="modal" class="modal" onclick="if(event.target===this)closeAdd()"><div class="sheet"><h3>Agregar personal</h3><input id="newName" placeholder="Nombre y apellido"><select id="newType"><option value="temp">Solo este día</option><option value="fixed">Personal fijo</option></select><div class="sheetactions"><button class="secondary" onclick="closeAdd()">Cancelar</button><button class="primary" onclick="addPerson()">Agregar</button></div></div></div><script>const defaultStaff=['Ana Torres','Carlos Mendoza','María López','José Ramírez','Paola Vera','Luis Cedeño','Daniela Ruiz','Miguel Zambrano'];const codes={'':'—','Trabajó':'T','Libre':'L','Falta':'F','Permiso':'P','Vacaciones':'V','Enfermedad':'E'};const states=['Trabajó','Libre','Falta','Permiso','Vacaciones','Enfermedad'];const classes={'':'','Trabajó':'st-trabajo','Libre':'st-libre','Falta':'st-falta','Permiso':'st-permiso','Vacaciones':'st-vacaciones','Enfermedad':'st-enfermedad'};let staff=JSON.parse(localStorage.getItem('cp-staff')||'null')||defaultStaff;let temps=JSON.parse(localStorage.getItem('cp-temps')||'{}');let data=JSON.parse(localStorage.getItem('cp-data')||'{}');let inactive=JSON.parse(localStorage.getItem('cp-inactive')||'{}');let selected=new Date(),currentPeople=[];function iso(d=selected){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){localStorage.setItem('cp-data',JSON.stringify(data));localStorage.setItem('cp-staff',JSON.stringify(staff));localStorage.setItem('cp-temps',JSON.stringify(temps));localStorage.setItem('cp-inactive',JSON.stringify(inactive))}function activeOn(n,k=iso()){return !inactive[n]||k<inactive[n]}function peopleToday(){return [...staff.filter(n=>activeOn(n)),...(temps[iso()]||[])]}function mark(n,s){data[iso()]??={};if(s)data[iso()][n]=s;else delete data[iso()][n];save();render()}function chooseStatus(i,s,e){e&&e.stopPropagation();if(currentPeople[i]!=null)mark(currentPeople[i],s)}function allWork(){data[iso()]??={};peopleToday().forEach(n=>data[iso()][n]='Trabajó');save();render()}function clearDay(){delete data[iso()];save();render()}function moveDay(d){selected.setDate(selected.getDate()+d);render()}function pickDate(v){if(v)selected=new Date(v+'T12:00:00');render()}function openAdd(type){modal.style.display='flex';newName.value='';newType.value=type||'temp'}function closeAdd(){modal.style.display='none'}function addPerson(){let n=newName.value.trim(),t=newType.value;if(!n)return;if(t==='fixed'){if(!staff.includes(n))staff.push(n);delete inactive[n]}else{temps[iso()]??=[];if(!temps[iso()].includes(n))temps[iso()].push(n)}save();closeAdd();render()}function removeTemp(n){temps[iso()]=(temps[iso()]||[]).filter(x=>x!==n);save();render()}function deactivate(n){let k=iso();if(!confirm('¿Dar de baja a '+n+' desde '+k+'?\n\nSus registros anteriores se conservarán.'))return;inactive[n]=k;save();render()}function reactivate(n){if(!confirm('¿Reactivar a '+n+'?\n\nVolverá a aparecer como personal activo y conservará todo su historial.'))return;delete inactive[n];save();render()}function toggleMenu(id,e){e.stopPropagation();document.querySelectorAll('.statusmenu.open').forEach(x=>x.id!==id&&x.classList.remove('open'));document.getElementById(id).classList.toggle('open')}function selector(st,i){let id='sm'+i;return `<div class="statuswrap"><button class="statusbtn ${classes[st]||''}" onclick="toggleMenu('${id}',event)">${codes[st]||'—'}</button><div class="statusmenu" id="${id}" onclick="event.stopPropagation()"><button onclick="chooseStatus(${i},'',event)">Sin marcar</button>${states.map(s=>`<button class="${classes[s]}" onclick="chooseStatus(${i},'${s}',event)">${s}</button>`).join('')}</div></div>`}document.addEventListener('click',()=>document.querySelectorAll('.statusmenu.open').forEach(x=>x.classList.remove('open')));function render(){let k=iso(),rec=data[k]||{},tmp=temps[k]||[];currentPeople=peopleToday();dayTitle.textContent=selected.toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'});datePicker.value=k;list.innerHTML=currentPeople.map((n,i)=>`<div class="person ${classes[rec[n]||'']}"><div><div class="name">${n}</div>${tmp.includes(n)?'<div class="temp">Temporal · solo hoy</div>':''}</div>${selector(rec[n]||'',i)}${tmp.includes(n)?`<button class="remove" onclick="removeTemp(currentPeople[${i}])">×</button>`:''}</div>`).join('');peopleList.innerHTML=staff.map(n=>`<div class="personRow ${inactive[n]?'inactive':''}"><div><div class="personRowName">${n}</div>${inactive[n]?`<span class="badgeOff">Baja: ${inactive[n]}</span>`:'<div class="muted">Personal activo</div>'}</div>${inactive[n]?`<button class="reactivateBtn" onclick='reactivate(${JSON.stringify(n)})'>Reactivar</button>`:`<button class="offBtn" onclick='deactivate(${JSON.stringify(n)})'>Dar de baja</button>`}</div>`).join('');renderSummary()}function summaryNames(){let ym=iso().slice(0,7),names=new Set(staff);Object.entries(data).forEach(([k,v])=>{if(k.slice(0,7)===ym)Object.keys(v).forEach(n=>names.add(n))});return [...names].filter(n=>Object.entries(data).some(([k,v])=>k.slice(0,7)===ym&&v[n])||activeOn(n,ym+'-01'))}function renderSummary(){let ym=iso().slice(0,7);summaryList.innerHTML=summaryNames().map(n=>{let c={};Object.entries(data).forEach(([k,v])=>{if(k.slice(0,7)===ym&&v[n])c[v[n]]=(c[v[n]]||0)+1});return `<div class="sum"><b>${n}</b>${inactive[n]&&inactive[n].slice(0,7)<=ym?` <span class="badgeOff">Baja ${inactive[n]}</span>`:''}${states.map(s=>`<div class="sumrow"><span class="${classes[s]}">${codes[s]} · ${s}</span><b>${c[s]||0}</b></div>`).join('')}</div>`}).join('')}function tab(t){['today','people','summary'].forEach(x=>document.getElementById(x).style.display=x===t?'block':'none');['Today','People','Summary'].forEach(x=>document.getElementById('n'+x).classList.remove('active'));document.getElementById('n'+t[0].toUpperCase()+t.slice(1)).classList.add('active');if(t==='summary')renderSummary()}function loadAugustDemo(force){if(force&&!confirm('¿Cargar el demo de agosto 2026?\n\nSe reemplazarán solamente los registros de agosto de los empleados ficticios.'))return;defaultStaff.forEach(n=>{if(!staff.includes(n))staff.push(n)});Object.keys(data).filter(k=>k.startsWith('2026-08-')).forEach(k=>delete data[k]);for(let d=1;d<=31;d++){let k='2026-08-'+String(d).padStart(2,'0'),wd=new Date(k+'T12:00:00').getDay();data[k]={};defaultStaff.forEach(n=>{if(n==='Luis Cedeño'&&d>=19)return;data[k][n]=(wd===0||wd===6)?'Libre':'Trabajó'})}function set(d,n,s){let k='2026-08-'+String(d).padStart(2,'0');data[k]??={};data[k][n]=s}set(3,'Carlos Mendoza','Permiso');set(5,'María López','Enfermedad');set(6,'María López','Enfermedad');set(10,'José Ramírez','Falta');set(11,'Paola Vera','Vacaciones');set(12,'Paola Vera','Vacaciones');set(13,'Paola Vera','Vacaciones');set(18,'Daniela Ruiz','Permiso');set(21,'Miguel Zambrano','Falta');inactive['Luis Cedeño']='2026-08-19';temps['2026-08-12']=['Sofía Andrade'];data['2026-08-12']['Sofía Andrade']='Trabajó';selected=new Date('2026-08-15T12:00:00');save();render();if(force)tab('summary')}render();</script></body></html>
