<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Personal</title>
</head>
<body>
<script>
(async()=>{
  try{
    let html=await fetch('./app.html?v=prod-20260904',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la app');return r.text()});
    html=html
      .replace('.demoBtn{background:#f4f3ff!important;color:#6941c6!important}','')
      .replace('<button class="addbtn demoBtn" onclick="loadFullDemo(true)">Demo completo</button>','')
      .replace(/const defaultStaff=\[[^\]]*\];/,'const defaultStaff=[];')
      .replace(/^function makeDemoAccount.*$/m,'')
      .replace(/^function loadFullDemo.*$/m,'')
      .replace('</head>','<link rel="stylesheet" href="./logistics.css?v=1"></head>')
      .replace('</style>','.moduleSwitch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 12px;background:#e9eef8;padding:5px;border-radius:15px}.moduleSwitch button{border:0;border-radius:11px;padding:12px 8px;font-weight:850;font-size:13px;background:transparent;color:#667085}.moduleSwitch button.active{background:#2563eb;color:#fff;box-shadow:0 2px 7px #1d4ed833}.logisticsPlaceholder{display:none;background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:28px 18px;text-align:center;margin-top:4px}.logisticsPlaceholder .boxIcon{font-size:38px;margin-bottom:8px}.logisticsPlaceholder h2{margin:0 0 7px}.logisticsPlaceholder p{margin:0;color:#667085;font-size:13px;line-height:1.45}</style>')
      .replace('<div class="accountbar">','<div class="moduleSwitch"><button id="modulePersonalBtn" class="active" onclick="switchModule(\'personal\')">👥 Control de Personal</button><button id="moduleLogisticsBtn" onclick="switchModule(\'logistica\');setTimeout(()=>logTab(\'daily\'),0)">📦 Logística</button></div><div id="personalModule"><div class="accountbar">')
      .replace('</div>\n<nav>','</div><div id="logisticsModule" class="logisticsPlaceholder"><div class="logHead"><div><h2>Logística</h2><div class="muted">Registro diario y configuración de marcas y locales.</div></div></div><div class="logTabs"><button id="logDailyTab" class="active" onclick="logTab(\'daily\')">Registro diario</button><button id="logConfigTab" onclick="logTab(\'config\')">Configuración</button></div><div id="logDailyView"></div><div id="logConfigView" style="display:none"><div id="logBrandsView"></div></div></div>\n<nav>')
      .replace('<span>☁ <span id="syncStatus">Conectando...</span></span><button onclick="logout()">Cerrar sesión</button>','<span>☁ <span id="syncStatus">Conectando...</span></span><div style="display:flex;gap:6px"><button onclick="openPassword()">Contraseña</button><button onclick="logout()">Cerrar sesión</button></div>')
      .replace('<div id="noteModal" class="modal"','<div id="passwordModal" class="modal" onclick="if(event.target===this)closePassword()"><div class="sheet"><h3>Cambiar contraseña</h3><div class="muted">Escribe la nueva contraseña dos veces.</div><input id="newPassword1" type="password" placeholder="Nueva contraseña" autocomplete="new-password"><input id="newPassword2" type="password" placeholder="Repetir contraseña" autocomplete="new-password"><div id="passwordMsg" class="loginMsg"></div><div class="sheetactions"><button class="secondary" onclick="closePassword()">Cancelar</button><button id="passwordSaveBtn" class="primary" onclick="changePassword()">Guardar</button></div></div></div>\n<div id="noteModal" class="modal"')
      .replace('async function logout(){','function switchModule(m){let personal=m===\'personal\';$(\'personalModule\').style.display=personal?\'block\':\'none\';$(\'logisticsModule\').style.display=personal?\'none\':\'block\';$(\'modulePersonalBtn\').classList.toggle(\'active\',personal);$(\'moduleLogisticsBtn\').classList.toggle(\'active\',!personal);document.querySelector(\'nav\').style.display=personal?\'grid\':\'none\';let h=document.querySelector(\'.hero h1\'),sub=document.querySelector(\'.hero .muted\'),icon=document.querySelector(\'.heroIcon\');if(h)h.textContent=personal?\'Control de Personal\':\'Logística\';if(sub)sub.textContent=personal?\'Registro diario de asistencia\':\'Gestión logística\';if(icon)icon.textContent=personal?\'✓\':\'📦\'}\nfunction openPassword(){$(\'newPassword1\').value=\'\';$(\'newPassword2\').value=\'\';$(\'passwordMsg\').textContent=\'\';$(\'passwordModal\').style.display=\'flex\';setTimeout(()=>$(\'newPassword1\').focus(),50)}\nfunction closePassword(){$(\'passwordModal\').style.display=\'none\';$(\'passwordMsg\').textContent=\'\'}\nasync function changePassword(){let p1=$(\'newPassword1\').value,p2=$(\'newPassword2\').value,msg=$(\'passwordMsg\'),btn=$(\'passwordSaveBtn\');msg.style.color=\'#b42318\';if(p1.length<8){msg.textContent=\'La contraseña debe tener al menos 8 caracteres.\';return}if(p1!==p2){msg.textContent=\'Las contraseñas no coinciden.\';return}if(!db||!cloudUser){msg.textContent=\'La sesión no está disponible.\';return}btn.disabled=true;btn.textContent=\'Guardando...\';let{error}=await db.auth.updateUser({password:p1});btn.disabled=false;btn.textContent=\'Guardar\';if(error){msg.textContent=\'No se pudo cambiar la contraseña: \'+error.message;return}msg.style.color=\'#067647\';msg.textContent=\'Contraseña cambiada correctamente.\';$(\'newPassword1\').value=\'\';$(\'newPassword2\').value=\'\';setTimeout(closePassword,1200)}\nasync function logout(){');
    const closeTag='</scr'+'ipt>';
    html=html.replace('</body>','<script src="./logistics.js?v=9">'+closeTag+'<script src="./logistics-locals-patch.js?v=2">'+closeTag+'<script src="./logistics-movements-patch.js?v=1">'+closeTag+'<script src="./logistics-preview.js?v=1">'+closeTag+'<script src="./logistics-export.js?v=1">'+closeTag+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:24px">No se pudo cargar la aplicación. Recarga la página.</div>'}
})();
</script>
</body>
</html>
