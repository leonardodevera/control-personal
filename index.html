<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Personal</title>
</head>
<body>
<script>
(async()=>{
  try{
    let html=await fetch('./app.html?v=prod-20260904',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la app');return r.text()});
    html=html
      .replace('.demoBtn{background:#f4f3ff!important;color:#6941c6!important}','')
      .replace('<button class="addbtn demoBtn" onclick="loadFullDemo(true)">Demo completo</button>','')
      .replace(/const defaultStaff=\[[^\]]*\];/,'const defaultStaff=[];')
      .replace(/^function makeDemoAccount.*$/m,'')
      .replace(/^function loadFullDemo.*$/m,'')
      .replace('<span>☁ <span id="syncStatus">Conectando...</span></span><button onclick="logout()">Cerrar sesión</button>','<span>☁ <span id="syncStatus">Conectando...</span></span><div style="display:flex;gap:6px"><button onclick="openPassword()">Contraseña</button><button onclick="logout()">Cerrar sesión</button></div>')
      .replace('<div id="noteModal" class="modal"','<div id="passwordModal" class="modal" onclick="if(event.target===this)closePassword()"><div class="sheet"><h3>Cambiar contraseña</h3><div class="muted">Escribe la nueva contraseña dos veces.</div><input id="newPassword1" type="password" placeholder="Nueva contraseña" autocomplete="new-password"><input id="newPassword2" type="password" placeholder="Repetir contraseña" autocomplete="new-password"><div id="passwordMsg" class="loginMsg"></div><div class="sheetactions"><button class="secondary" onclick="closePassword()">Cancelar</button><button id="passwordSaveBtn" class="primary" onclick="changePassword()">Guardar</button></div></div></div>\n<div id="noteModal" class="modal"')
      .replace('async function logout(){','function openPassword(){$(\'newPassword1\').value=\'\';$(\'newPassword2\').value=\'\';$(\'passwordMsg\').textContent=\'\';$(\'passwordModal\').style.display=\'flex\';setTimeout(()=>$(\'newPassword1\').focus(),50)}\nfunction closePassword(){$(\'passwordModal\').style.display=\'none\';$(\'passwordMsg\').textContent=\'\'}\nasync function changePassword(){let p1=$(\'newPassword1\').value,p2=$(\'newPassword2\').value,msg=$(\'passwordMsg\'),btn=$(\'passwordSaveBtn\');msg.style.color=\'#b42318\';if(p1.length<8){msg.textContent=\'La contraseña debe tener al menos 8 caracteres.\';return}if(p1!==p2){msg.textContent=\'Las contraseñas no coinciden.\';return}if(!db||!cloudUser){msg.textContent=\'La sesión no está disponible.\';return}btn.disabled=true;btn.textContent=\'Guardando...\';let{error}=await db.auth.updateUser({password:p1});btn.disabled=false;btn.textContent=\'Guardar\';if(error){msg.textContent=\'No se pudo cambiar la contraseña: \'+error.message;return}msg.style.color=\'#067647\';msg.textContent=\'Contraseña cambiada correctamente.\';$(\'newPassword1\').value=\'\';$(\'newPassword2\').value=\'\';setTimeout(closePassword,1200)}\nasync function logout(){');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:24px">No se pudo cargar la aplicación. Recarga la página.</div>'}
})();
</script>
</body>
</html>
