<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Personal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{max-width:760px;margin:auto;padding:14px 12px 88px}h1{margin:0;font-size:24px}.muted{color:#667085;font-size:12px}.toolbar,.datebar{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:10px;margin-top:10px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.toolbar button,.datebar button,.addbtn{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:#eef2ff;color:#245eea}.datebar{display:flex;gap:8px;align-items:center}.datebar input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:9px;font:inherit}.actions{display:flex;gap:7px;margin:10px 0}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd!important}.table{background:#fff;border:1px solid #e4e7ec;border-radius:14px;overflow:visible}.head,.person{display:grid;grid-template-columns:minmax(0,1fr) 74px 38px;align-items:center;gap:8px;padding:8px 10px}.head{background:#f8fafc;color:#667085;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:14px 14px 0 0}.person{border-top:1px solid #eef1f4;min-height:48px;position:relative;background:#fff}.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.temp{font-size:10px;color:#b54708}.statuswrap{position:relative}.statusbtn{width:100%;height:34px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font-weight:800;font-size:14px}.statusmenu{display:none;position:absolute;right:0;top:39px;z-index:20;width:155px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.15);padding:5px}.statusmenu.open{display:block}.statusmenu button{width:100%;border:0;background:#fff;text-align:left;padding:9px 10px;border-radius:7px;font-size:13px}.statusmenu button:hover{background:#f2f4f7}.remove{border:0;background:transparent;color:#98a2b3;font-size:18px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11px;color:#667085}.legend span{background:#fff;border:1px solid #e4e7ec;border-radius:999px;padding:5px 7px}.panel{display:none}.sum{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:10px;margin:8px 0}.sumrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}nav button{border:0;background:#fff;padding:14px 4px;font-weight:700;color:#667085}nav button.active{color:#2563eb}.modal{position:fixed;inset:0;background:rgba(16,24,40,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:100%;max-width:760px;background:#fff;border-radius:18px 18px 0 0;padding:18px}.sheet h3{margin:0 0 12px}.sheet input,.sheet select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 10px;font:inherit}.sheetactions{display:flex;gap:8px}.sheetactions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800}.danger{color:#d92d20}
</style></head>
<body><div class="app">
<h1>Control de Personal</h1><div class="muted">Vista rápida diaria</div>
<section id="today">
<div class="toolbar"><button onclick="moveDay(-1)">‹</button><strong id="dayTitle"></strong><button onclick="moveDay(1)">›</button></div>
<div class="datebar"><input id="datePicker" type="date" onchange="pickDate(this.value)"><button onclick="openAdd()">+ Personal</button></div>
<div class="actions"><button class="primary" onclick="allWork()">Todos T</button><button class="secondary" onclick="clearDay()">Limpiar día</button></div>
<div class="table"><div class="head"><div>Personal</div><div>Estado</div><div></div></div><div id="list"></div></div>
<div class="legend"><span>T Trabajo</span><span>L Libre</span><span>F Falta</span><span>P Permiso</span><span>V Vacaciones</span><span>E Enfermedad</span></div>
</section>
<section id="people" class="panel"><h2>Personal fijo</h2><button class="addbtn" onclick="openAdd('fixed')">+ Agregar personal</button><div id="peopleList"></div></section>
<section id="summary" class="panel"><h2>Resumen mensual</h2><div id="summaryList"></div></section>
</div>
<nav><button id="nToday" class="active" onclick="tab('today')">Hoy</button><button id="nPeople" onclick="tab('people')">Personal</button><button id="nSummary" onclick="tab('summary')">Resumen</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeAdd()"><div class="sheet"><h3>Agregar personal</h3><input id="newName" placeholder="Nombre y apellido"><select id="newType"><option value="temp">Solo este día</option><option value="fixed">Personal fijo</option></select><div class="sheetactions"><button class="secondary" onclick="closeAdd()">Cancelar</button><button class="primary" onclick="addPerson()">Agregar</button></div></div></div>
<script>
const defaultStaff=['Ana Torres','Carlos Mendoza','María López','José Ramírez','Paola Vera','Luis Cedeño','Daniela Ruiz','Miguel Zambrano'];
const codes={'':'—','Trabajó':'T','Libre':'L','Falta':'F','Permiso':'P','Vacaciones':'V','Enfermedad':'E'};
const states=['Trabajó','Libre','Falta','Permiso','Vacaciones','Enfermedad'];
let staff=JSON.parse(localStorage.getItem('cp-staff')||'null')||defaultStaff;
let temps=JSON.parse(localStorage.getItem('cp-temps')||'{}');
let data=JSON.parse(localStorage.getItem('cp-data')||'{}');let selected=new Date();
function iso(d=selected){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function save(){localStorage.setItem('cp-data',JSON.stringify(data));localStorage.setItem('cp-staff',JSON.stringify(staff));localStorage.setItem('cp-temps',JSON.stringify(temps))}
function peopleToday(){return [...staff,...(temps[iso()]||[])]}
function mark(n,s){data[iso()]??={};if(s)data[iso()][n]=s;else delete data[iso()][n];save();render()}
function allWork(){data[iso()]??={};peopleToday().forEach(n=>data[iso()][n]='Trabajó');save();render()}
function clearDay(){delete data[iso()];save();render()}
function moveDay(d){selected.setDate(selected.getDate()+d);render()}
function pickDate(v){if(v)selected=new Date(v+'T12:00:00');render()}
function openAdd(type){document.getElementById('modal').style.display='flex';document.getElementById('newName').value='';document.getElementById('newType').value=type||'temp';setTimeout(()=>document.getElementById('newName').focus(),50)}
function closeAdd(){document.getElementById('modal').style.display='none'}
function addPerson(){let n=document.getElementById('newName').value.trim();let t=document.getElementById('newType').value;if(!n)return;if(t==='fixed'){if(!staff.includes(n))staff.push(n)}else{temps[iso()]??=[];if(!temps[iso()].includes(n))temps[iso()].push(n)}save();closeAdd();render()}
function removeTemp(n){temps[iso()]=(temps[iso()]||[]).filter(x=>x!==n);if(data[iso()])delete data[iso()][n];save();render()}
function removeFixed(n){if(!confirm('¿Quitar a '+n+' del personal fijo?'))return;staff=staff.filter(x=>x!==n);save();render()}
function toggleMenu(id,e){e.stopPropagation();document.querySelectorAll('.statusmenu.open').forEach(x=>{if(x.id!==id)x.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
function selector(n,current,i){let id='sm'+i;return `<div class="statuswrap"><button class="statusbtn" onclick="toggleMenu('${id}',event)">${codes[current]||'—'}</button><div class="statusmenu" id="${id}"><button onclick="mark(${JSON.stringify(n)},'')">Sin marcar</button>${states.map(s=>`<button onclick="mark(${JSON.stringify(n)},${JSON.stringify(s)})">${s}</button>`).join('')}</div></div>`}
document.addEventListener('click',()=>document.querySelectorAll('.statusmenu.open').forEach(x=>x.classList.remove('open')));
function render(){let k=iso(),rec=data[k]||{},tmp=temps[k]||[];document.getElementById('dayTitle').textContent=selected.toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'}).replace(/^./,c=>c.toUpperCase());document.getElementById('datePicker').value=k;document.getElementById('list').innerHTML=peopleToday().map((n,i)=>`<div class="person"><div><div class="name">${n}</div>${tmp.includes(n)?'<div class="temp">Temporal · solo hoy</div>':''}</div>${selector(n,rec[n]||'',i)}<button class="remove" onclick="${tmp.includes(n)?`removeTemp(${JSON.stringify(n)})`:'void(0)'}">${tmp.includes(n)?'×':''}</button></div>`).join('');document.getElementById('peopleList').innerHTML=staff.map(n=>`<div class="sum"><div style="display:flex;justify-content:space-between;align-items:center"><b>${n}</b><button class="remove danger" onclick="removeFixed(${JSON.stringify(n)})">×</button></div></div>`).join('');renderSummary()}
function renderSummary(){let m=selected.getMonth(),y=selected.getFullYear();document.getElementById('summaryList').innerHTML=staff.map(n=>{let c={};Object.entries(data).forEach(([k,v])=>{let d=new Date(k+'T12:00:00');if(d.getMonth()===m&&d.getFullYear()===y&&v[n])c[v[n]]=(c[v[n]]||0)+1});return `<div class="sum"><b>${n}</b>${states.map(s=>`<div class="sumrow"><span>${codes[s]} · ${s}</span><b>${c[s]||0}</b></div>`).join('')}</div>`}).join('')}
function tab(t){['today','people','summary'].forEach(x=>document.getElementById(x).style.display=x===t?'block':'none');['Today','People','Summary'].forEach(x=>document.getElementById('n'+x).classList.remove('active'));document.getElementById('n'+t[0].toUpperCase()+t.slice(1)).classList.add('active');if(t==='summary')renderSummary()}
render();
</script></body></html>
