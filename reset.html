<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reiniciar Control de Personal</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:390px;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px}.card h1{margin:0 0 8px}.card p{color:#667085;font-size:13px}.card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0}.card button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:12px;background:#b42318;color:#fff;font-weight:800}.msg{margin-top:12px;font-size:13px;text-align:center}.ok{color:#067647}.bad{color:#b42318}
</style>
</head>
<body>
<div class="card">
<h1>Reiniciar datos</h1>
<p>Esto borrará todas las cuentas, personal, asistencias, observaciones, ciudades, bajas y datos demo. El usuario y contraseña de acceso no se borran.</p>
<input id="email" type="email" placeholder="Correo de acceso" autocomplete="username">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<button id="btn" onclick="resetData()">BORRAR DATOS DE PRUEBA</button>
<div id="msg" class="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zclssthkheqxraubckva.supabase.co';
const SUPABASE_KEY='sb_publishable_NlLmA1VYaFChrBfkHUBnAQ_emOlViZs';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const emptyState={accounts:{main:{name:'Cuenta principal',staff:[],temps:{},data:{},inactive:{},cityHistory:{},notes:{}}},currentAccountId:'main'};
async function resetData(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  if(!email||!password){msg.className='msg bad';msg.textContent='Ingresa correo y contraseña.';return}
  if(!confirm('¿Confirmas que quieres borrar TODOS los datos de prueba?\n\nEl usuario de acceso se conservará.'))return;
  btn.disabled=true;msg.className='msg';msg.textContent='Reiniciando...';
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error||!data.user){msg.className='msg bad';msg.textContent='Correo o contraseña incorrectos.';btn.disabled=false;return}
  const {error:saveError}=await db.from('app_state').upsert({user_id:data.user.id,data:emptyState},{onConflict:'user_id'});
  if(saveError){msg.className='msg bad';msg.textContent='No se pudo reiniciar la nube.';btn.disabled=false;return}
  localStorage.removeItem('cp-accounts');localStorage.removeItem('cp-current-account');localStorage.removeItem('cp-staff');localStorage.removeItem('cp-temps');localStorage.removeItem('cp-data');localStorage.removeItem('cp-inactive');localStorage.removeItem('cp-cities');localStorage.removeItem('cp-city-history');localStorage.removeItem('cp-notes');
  localStorage.setItem('cp-accounts',JSON.stringify(emptyState.accounts));localStorage.setItem('cp-current-account','main');
  msg.className='msg ok';msg.textContent='Listo. Datos borrados. Abriendo la app...';
  setTimeout(()=>location.href='./',900);
}
</script>
</body>
</html>
